<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="week4.css">
</head>
<body>
    <main>
        <section class="block">
            <h1>Project Gallery</h1>
            <div class="slider-container">
                <div class="slider-viewport">
                    <div class="slider-track" id="sliderTrack">
                        <div class="slide"><img src="1.jpg" alt="Slide 1"></div>
                        <div class="slide"><img src="2.jpg" alt="Slide 2"></div>
                        <div class="slide"><img src="3.jpg" alt="Slide 3"></div>
                        <div class="slide"><img src="4.jpg" alt="Slide 4"></div>
                    </div>
                </div>
                <button class="nav-arrow prev" id="prevBtn">&#10094;</button>
                <button class="nav-arrow next" id="nextBtn">&#10095;</button>
                <div class="indicator-container" id="indicatorContainer"></div>
            </div>
        </section>
    </main>
    <script src="week4.js"></script>
</body>
</html>
